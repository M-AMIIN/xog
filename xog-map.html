<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xog — Territorial History of the Horn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ── DARK CARTOGRAPHIC THEME ────────────────────────────────── */
:root {
  --bg:         #080B12;
  --surface:    #0E1219;
  --card:       #141A24;
  --raised:     #1A2030;
  --border:     rgba(196,154,60,0.10);
  --border-mid: rgba(196,154,60,0.20);
  --gold:       #C49A3C;
  --gold-dim:   rgba(196,154,60,0.45);
  --gold-glow:  rgba(196,154,60,0.12);
  --rust:       #D4956A;
  --text:       #E8DCC8;
  --text-bright:#F4EDE0;
  --muted:      #8A7E6A;
  --faint:      #5A5040;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body {
  height: 100%;
  overflow: hidden;
  font-family: 'DM Mono', monospace;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  padding-top: 56px;
}

#xog-footer { display: none !important; }

/* ── MAP LAYOUT ── */
.map-wrap { flex: 1; position: relative; overflow: hidden; min-height: 0; }

/*
  position: relative + z-index: 0 creates an isolation stacking context.
  This confines all of Leaflet's internal z-indices (200–700) inside #map-div.
  The info panel and controls (z-index: 10) then sit cleanly above the map.
  Without this, Leaflet's overlay pane (z-index 400) covers the UI elements.
*/
#map-div {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 0;
}

/* ── LEAFLET DARK OVERRIDES ── */
.leaflet-container { background: #060A14 !important; font-family: 'DM Mono', monospace; }
.leaflet-pane svg { overflow: visible; }
.leaflet-control-zoom        { display: none; }
.leaflet-control-attribution { display: none; }

/* Territory pulse */
@keyframes tPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.terr-pulse { animation: none; }

/* Horn ring pulse */
@keyframes hornPulse { 0%,100%{stroke-opacity:.3} 50%{stroke-opacity:.7} }
.horn-ring-path { animation: none; }

/* Territory hover tooltip */
.leaflet-tooltip.terr-tip {
  background: rgba(6,4,2,0.95);
  border: 1px solid rgba(196,154,60,0.25);
  border-radius: 2px;
  padding: .5rem .8rem;
  font-family: 'DM Mono', monospace;
  font-size: .68rem;
  color: #E8DCC8;
  letter-spacing: .03em;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
  pointer-events: none;
}
.leaflet-tooltip.terr-tip::before { display: none; }

/* City label tooltips */
.leaflet-tooltip.city-tip {
  background: transparent;
  border: none;
  box-shadow: none;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: #E8DCC8;
  text-shadow:
    -2px -2px 4px rgba(6,10,20,.95),
     2px -2px 4px rgba(6,10,20,.95),
    -2px  2px 4px rgba(6,10,20,.95),
     2px  2px 4px rgba(6,10,20,.95);
  white-space: nowrap;
  padding: 2px 0;
}
.leaflet-tooltip.city-tip::before { display: none; }

.i-citynotes {
  margin-top: .8rem; padding-top: .8rem;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: .32rem;
}
.i-citynotes strong {
  font-size: .58rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--gold);
  display: block; margin-bottom: .15rem;
}
.i-citynotes .cn {
  font-size: .63rem; color: var(--muted); line-height: 1.45;
}
.city-tip.future {
  color: rgba(232,220,200,0.52);
}
.capital-tip {
  font-size: 10px;
  color: #f3e4c0;
}
.world-tip {
  font-size: 9px;
  color: #9ed0e0;
}
.place-label {
  display: inline-block;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  line-height: 1;
  padding-left: 8px;
  text-shadow:
    -2px -2px 4px rgba(6,10,20,.98),
     2px -2px 4px rgba(6,10,20,.98),
    -2px  2px 4px rgba(6,10,20,.98),
     2px  2px 4px rgba(6,10,20,.98);
}
.place-label.somali-live { color: #6ee08d; }
.place-label.somali-future { color: rgba(190,98,98,.88); }
.place-label.world-city { color: #9ed0e0; font-size: 8.5px; }
.place-label.era-capital { color: #f0d28c; font-size: 9px; }
.leaflet-tooltip.info-tip {
  background: rgba(8,11,18,0.96);
  border: 1px solid rgba(196,154,60,0.22);
  color: #e8dcc8;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  line-height: 1.45;
  padding: .45rem .55rem;
  box-shadow: 0 6px 16px rgba(0,0,0,.45);
}
.leaflet-tooltip.info-tip::before { display:none; }


/* Divicon labels */
.ocean-lbl {
  font-family: 'Source Serif 4', serif;
  font-style: italic;
  letter-spacing: .18em;
  color: rgba(100,140,180,0.35);
  font-size: 10px;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  transform: translateX(-50%);
  display: block;
}
.ctry-lbl {
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: rgba(196,154,60,0.25);
  font-size: 7.5px;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  transform: translateX(-50%);
  display: block;
}

/* ── LOADER ── */
.loader {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1.2rem; z-index: 500;
  transition: opacity .6s;
}
.loader.gone { opacity: 0; pointer-events: none; }
.loader-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.2rem; font-weight: 300;
  color: var(--gold); letter-spacing: .12em;
}
.loader-txt {
  font-size: .62rem; letter-spacing: .22em;
  text-transform: uppercase; color: var(--muted);
}
.loader-bar {
  width: 120px; height: 1px; background: var(--border);
  position: relative; overflow: hidden;
}
.loader-bar::after {
  content: ''; position: absolute; left: 0; top: 0; height: 1px;
  background: var(--gold);
  animation: lb 1.4s ease-in-out infinite;
}
@keyframes lb { 0%{width:0;left:0} 50%{width:100%;left:0} 100%{width:0;left:100%} }

/* ── INFO PANEL ── */
.info {
  position: absolute; top: 1rem; left: 1rem;
  width: 310px; max-height: calc(100% - 2rem);
  overflow-y: auto; overflow-x: hidden;
  background: rgba(10, 14, 22, 0.93);
  border: 1px solid rgba(196,154,60,0.12);
  border-radius: 3px;
  padding: 1.4rem 1.5rem;
  z-index: 10;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.info::-webkit-scrollbar { width: 4px; }
.info::-webkit-scrollbar-track { background: transparent; }
.info::-webkit-scrollbar-thumb { background: rgba(196,154,60,0.2); border-radius: 2px; }
.info::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--gold), transparent);
}
.i-era {
  font-size: .62rem; letter-spacing: .22em;
  text-transform: uppercase; color: var(--rust); margin-bottom: .5rem;
}
.i-year {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem; font-weight: 300;
  color: var(--gold); line-height: 1; margin-bottom: .5rem;
}
.i-year small { font-size: 1rem; opacity: .6; }
.i-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem; font-weight: 600;
  color: var(--text-bright); line-height: 1.35; margin-bottom: .8rem;
}
.i-desc {
  font-family: 'Source Serif 4', serif;
  font-size: .78rem; color: var(--muted); line-height: 1.8;
  border-top: 1px solid var(--border); padding-top: .8rem;
}
.i-legend {
  margin-top: .8rem; padding-top: .8rem;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: .38rem;
}
.li {
  display: flex; align-items: center; gap: .5rem;
  font-size: .62rem; color: var(--muted);
}
.lsw { width: 22px; height: 8px; flex-shrink: 0; border-radius: 1px; }
.i-sel {
  margin-top: .8rem; padding-top: .8rem;
  border-top: 1px solid var(--border); display: none;
}
.i-sel strong {
  font-size: .58rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--gold);
  display: block; margin-bottom: .3rem;
}
.i-sel span { font-size: .72rem; color: var(--text); }

/* ── CONTROLS ── */
.map-ctrls {
  position: absolute; top: 1rem; right: 1rem;
  z-index: 10; display: flex; flex-direction: column; gap: .4rem;
}
.mc {
  background: rgba(10,14,22,0.88);
  border: 1px solid rgba(196,154,60,0.12);
  border-radius: 2px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: .62rem; letter-spacing: .08em;
  text-transform: uppercase;
  padding: .45rem .8rem;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.mc:hover, .mc.on {
  border-color: rgba(196,154,60,0.35);
  color: var(--gold);
  background: rgba(196,154,60,0.06);
}

/* ── TIMELINE ── */
.tl-bar {
  flex-shrink: 0; background: var(--surface);
  border-top: 1px solid var(--border);
  padding: .85rem 2rem .7rem; z-index: 10;
}
.era-track {
  display: flex; align-items: center; position: relative;
  margin-bottom: .6rem;
}
.era-track::before {
  content: ''; position: absolute; top: 50%; left: 0; right: 0;
  height: 1px; background: rgba(196,154,60,0.1);
  transform: translateY(-50%); pointer-events: none;
}
.era-btn {
  position: relative; flex: 1; background: none; border: none;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: .3rem; padding: .2rem 0;
}
.era-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--card);
  border: 1.5px solid rgba(196,154,60,0.18);
  transition: all .3s; z-index: 1;
}
.era-btn:hover .era-dot, .era-btn.active .era-dot {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(196,154,60,0.4);
}
.era-yr {
  font-size: .5rem; color: rgba(196,154,60,0.3);
  white-space: nowrap; text-align: center; transition: color .2s;
  line-height: 1.3;
}
.era-btn.active .era-yr, .era-btn:hover .era-yr { color: var(--gold); }
.tl-ctrls {
  display: flex; align-items: center; justify-content: space-between;
}
.c-btn {
  background: none;
  border: 1px solid rgba(196,154,60,0.12);
  border-radius: 2px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: .58rem; letter-spacing: .08em;
  text-transform: uppercase;
  padding: .3rem .75rem; cursor: pointer; transition: all .2s;
}
.c-btn:hover { border-color: rgba(196,154,60,0.35); color: var(--gold); }
.p-btn {
  background: rgba(196,154,60,0.06);
  border: 1px solid rgba(196,154,60,0.22);
  border-radius: 2px;
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: .58rem; letter-spacing: .1em;
  text-transform: uppercase;
  padding: .3rem .9rem; cursor: pointer; transition: all .2s;
}
.p-btn.playing { border-color: rgba(212,149,106,0.3); color: var(--rust); }
.caveat {
  font-size: .52rem; color: rgba(196,154,60,0.28);
  letter-spacing: .04em; text-align: center; flex: 1;
  padding: 0 1rem;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .info { width: 240px; padding: 1rem 1.1rem; }
  .i-year { font-size: 1.8rem; }
  .i-title { font-size: 1rem; }
  .i-desc { font-size: .72rem; }
  .map-ctrls { top: auto; bottom: 1rem; right: .6rem; flex-direction: row; }
  .tl-bar { padding: .7rem 1rem .5rem; }
  .era-yr { font-size: .42rem; }
  .caveat { display: none; }
}
@media (max-width: 480px) {
  .info { width: 200px; left: .5rem; top: .5rem; padding: .8rem; }
  .i-desc { font-size: .66rem; line-height: 1.65; }
}
</style>

<body>

<div class="map-wrap">
  <div id="map-div"></div>
  <div class="loader" id="loader">
    <div class="loader-logo">Xog</div>
    <div class="loader-txt">Loading territorial history</div>
    <div class="loader-bar"></div>
  </div>

  <div class="info">
    <div class="i-era"    id="i-era"></div>
    <div class="i-year"   id="i-year"></div>
    <div class="i-title"  id="i-title"></div>
    <div class="i-desc"   id="i-desc"></div>
    <div class="i-legend" id="i-legend"></div>
    <div class="i-sel" id="i-sel">
      <strong>Selected</strong>
      <span id="i-sel-name"></span>
    </div>
    <div class="i-citynotes" id="i-citynotes"></div>
  </div>

  <div class="map-ctrls">
    <button class="mc on" id="btn-horn">Horn focus</button>
    <button class="mc"    id="btn-world">World view</button>
    <button class="mc"    id="btn-zi">+ Zoom in</button>
    <button class="mc"    id="btn-zo">- Zoom out</button>
    <button class="mc"    id="btn-reset">Reset</button>
    <button class="mc"    id="btn-capitals">Era capitals</button>
    <button class="mc"    id="btn-worldcaps">World capitals</button>
    <button class="mc"    id="btn-cities">Somali cities</button>
    <button class="mc"    id="btn-somaliweyn">Somaliweyn</button>

  </div>
</div>

<div class="tl-bar">
  <div class="era-track" id="era-track"></div>
  <div class="tl-ctrls">
    <button class="c-btn" id="prev-btn">&larr; Prev</button>
    <span class="caveat">Ancient & medieval layers are conservative reconstructions &middot; where evidence is contested, boundaries favor the Somali reading &middot; colonial layers follow supplied historical maps &middot; click any territory for detail</span>
    <button class="p-btn" id="play-btn">&#9654; Play</button>
    <button class="c-btn" id="next-btn">Next &rarr;</button>
  </div>
</div>

// ═══════════════════════════════════════════════════════════════

const P = coords => ({type:'Feature', geometry:{type:'Polygon', coordinates:[coords]}});

function makeLabel(text, className, latLng, dx = 0, dy = 0) {
  return L.marker(latLng, {
    icon: L.divIcon({
      html: `<span class="${className}" style="transform: translate(${dx}px, ${dy}px);">${text}</span>`,
      className: '',
      iconSize: null,
      iconAnchor: [0, 0]
    }),
    interactive: false,
    keyboard: false
  });
}

function formatYearLabel(y) {
  if (y < 0) return Math.abs(y) + ' BCE';
  return y + ' CE';
}

function formatCityHover(city, exists) {
  const when = formatYearLabel(city.estYear);
  return exists
    ? `<strong>${city.name}</strong><br>${city.label}<br><span style="color:#8a7e6a">Established / attested: ${when}</span>`
    : `<strong>${city.name}</strong><br>Not yet attested in this era.<br><span style="color:#8a7e6a">Later emergence: ${when}</span>`;
}

function formatCapitalHover(c) {
  const note = c.note ? `<br>${c.note}` : '';
  return `<strong>${c.n}</strong>${note}`;
}

function renderLabels() {
  labelGroup.clearLayers();
  OCNLBLS.forEach(ol => makeLabel(ol.t, 'ocean-lbl', [ol.la, ol.lo]).addTo(labelGroup));
  if (!isWorld) CTRYLBLS.forEach(cl => makeLabel(cl.t, 'ctry-lbl', [cl.la, cl.lo]).addTo(labelGroup));
}

function drawRing() {
  ringGroup.clearLayers();
  if (isWorld) return;
  L.circle([5.5, 47], {
    radius: 820000,
    fill: false,
    color: '#C49A3C',
    weight: 1.2,
    dashArray: '8 5',
    interactive: false,
    className: 'horn-ring-path'
  }).addTo(ringGroup);
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function addCapitalMarker(c) {
  L.circleMarker([c.la, c.lo], {
    pane: 'cityPane',
    radius: c.uncertain ? 6.5 : 6,
    fillOpacity: 0,
    color: c.uncertain ? 'rgba(240,210,140,0.35)' : 'rgba(240,210,140,0.28)',
    weight: 1,
    dashArray: c.uncertain ? '3 3' : null,
    interactive: false
  }).addTo(cityGroup);

  const dot = L.circleMarker([c.la, c.lo], {
    pane: 'cityPane',
    radius: c.uncertain ? 2.5 : 2.8,
    fillColor: '#f0d28c',
    fillOpacity: 0.95,
    color: '#171108',
    weight: 1,
    interactive: true
  }).addTo(cityGroup);

  dot.bindTooltip(formatCapitalHover(c), {
    className: 'info-tip',
    direction: 'top',
    offset: [0, -8],
    sticky: true
  });

  makeLabel(c.n, 'place-label era-capital', [c.la, c.lo], 8, -2).addTo(cityNameGroup);
}

function addSomaliCityMarker(city, era) {
  const exists = city.estYear <= era.refYear;
  L.circleMarker([city.la, city.lo], {
    pane: 'cityPane',
    radius: exists ? 5 : 4.5,
    fillOpacity: 0,
    color: exists ? 'rgba(110,224,141,0.22)' : 'rgba(184,95,99,0.18)',
    weight: 1,
    dashArray: exists ? null : '2 3',
    interactive: false
  }).addTo(cityGroup);

  const dot = L.circleMarker([city.la, city.lo], {
    pane: 'cityPane',
    radius: exists ? 2.5 : 2.3,
    fillColor: exists ? '#6ee08d' : '#b85f63',
    fillOpacity: exists ? 0.96 : 0.82,
    color: exists ? '#08130c' : '#180a0b',
    weight: 1,
    interactive: true
  }).addTo(cityGroup);

  dot.bindTooltip(formatCityHover(city, exists), {
    className: 'info-tip',
    direction: 'top',
    offset: [0, -8],
    sticky: true
  });

  makeLabel(city.name, `place-label ${exists ? 'somali-live' : 'somali-future'}`, [city.la, city.lo], 8, -2).addTo(cityNameGroup);
}

    pane: 'worldCityPane',
    radius: 5.2,
    fillOpacity: 0,
    color: 'rgba(158,208,224,0.22)',
    weight: 1,
    interactive: false
  }).addTo(worldCityGroup);

  const dot = L.circleMarker([c.la, c.lo], {
    pane: 'worldCityPane',
    radius: 2.2,
    fillColor: '#9ed0e0',
    fillOpacity: 0.95,
    color: '#081018',
    weight: 1,
    interactive: true
  }).addTo(worldCityGroup);

  dot.bindTooltip(formatCapitalHover(c), {
    className: 'info-tip',
    direction: 'top',
    offset: [0, -8],
    sticky: true
  });

  makeLabel(c.n, 'place-label world-city', [c.la, c.lo], 7, -1).addTo(worldNameGroup);
}

function renderCityNotes(era) {
  const box = document.getElementById('i-citynotes');
  const rows = [
    '<strong>Capitals, cities & notes</strong>',
    ...era.cityNotes.map(t => `<div class="cn">${t}</div>`),
    '<div class="cn">Green Somali dots mark places already attested in the era; dim red dots mark towns that enter the record later and can be inspected on hover.</div>',
    '<div class="cn">World capitals are selective state anchors, not an exhaustive census of every polity on earth.</div>'
  ];
  box.innerHTML = rows.join('');
}

function drawCities(era) {
  cityGroup.clearLayers();
  worldCityGroup.clearLayers();
  cityNameGroup.clearLayers();
  worldNameGroup.clearLayers();
  if (showCapitals) era.capitals.forEach(addCapitalMarker);
  if (showSomaliCities) MAJOR_SOMALI_CITIES.forEach(city => addSomaliCityMarker(city, era));
  if (showWorldCapitals && era.worldCapitals) era.worldCapitals.forEach(addWorldCapitalMarker);
}

function renderEra(idx) {
  const era = ERAS[idx];
  document.getElementById('i-era').textContent   = era.era;
  document.getElementById('i-year').innerHTML    = era.year + '<small> ' + era.suffix + '</small>';
  document.getElementById('i-title').textContent = era.title;
  document.getElementById('i-desc').textContent  = era.desc;
  document.getElementById('i-sel').style.display = 'none';
  renderCityNotes(era);

  const leg = document.getElementById('i-legend');
  leg.innerHTML = '';
  terrGroup.clearLayers();

  era.territories.forEach(t => {
    const fillOpacity = t.fillOpacity ?? (t.dashed ? 0.09 : 0.18);
    const geoLayer = L.geoJSON(t.feature, {
      style: {
        fillColor: t.color,
        fillOpacity,
        color: t.color,
        weight: t.dashed ? 1.8 : 2.2,
        dashArray: t.dashed ? '6 4' : null,
        lineCap: 'round',
        lineJoin: 'round'
      }
    });

    geoLayer.bindTooltip(t.name, {
      sticky: true,
      className: 'terr-tip',
      direction: 'top',
      offset: [0, -4]
    });

    geoLayer.on('click', function(e) {
      document.getElementById('i-sel').style.display = 'block';
      document.getElementById('i-sel-name').textContent = t.name;
      L.DomEvent.stopPropagation(e);
    });

    geoLayer.on('add', function() {
      this.eachLayer(l => {
        if (!l._path) return;
        l._path.style.filter = `drop-shadow(0 0 8px ${hexToRgba(t.color, 0.22)})`;
      });
    });

    terrGroup.addLayer(geoLayer);

    const row = document.createElement('div');
    row.className = 'li';
    row.innerHTML = `<svg class="lsw" viewBox="0 0 22 8"><rect width="22" height="8" fill="${hexToRgba(t.color, fillOpacity)}" stroke="${t.color}" stroke-width="1.2" ${t.dashed ? 'stroke-dasharray="4 2"' : ''}></rect></svg><span>${t.name}</span>`;
    leg.appendChild(row);
  });

  drawCities(era);
  drawRing();
  renderLabels();
  if (somaliweynOn) drawSomaliweyn();


  document.querySelectorAll('.era-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
}

map.on('click', () => document.getElementById('i-sel').style.display = 'none');

function switchView(world) {
  isWorld = world;
  map.setView(world ? WORLD_CENTER : HORN_CENTER, world ? WORLD_ZOOM : HORN_ZOOM);
  renderEra(cur);
  document.getElementById('btn-world').classList.toggle('on',  world);
  document.getElementById('btn-horn').classList.toggle('on',  !world);
}

document.getElementById('btn-world').onclick = () => switchView(true);
document.getElementById('btn-horn').onclick  = () => switchView(false);
document.getElementById('btn-zi').onclick    = () => map.zoomIn();
document.getElementById('btn-zo').onclick    = () => map.zoomOut();
document.getElementById('btn-reset').onclick = () => {
  isWorld = false;
  map.setView(HORN_CENTER, HORN_ZOOM);
  document.getElementById('btn-world').classList.remove('on');
  document.getElementById('btn-horn').classList.add('on');
  renderEra(cur);
};

document.getElementById('btn-capitals').onclick = () => {
  showCapitals = !showCapitals;
  document.getElementById('btn-capitals').classList.toggle('on', showCapitals);
  drawCities(ERAS[cur]);
};
document.getElementById('btn-capitals').classList.toggle('on', showCapitals);

document.getElementById('btn-worldcaps').onclick = () => {
  showWorldCapitals = !showWorldCapitals;
  document.getElementById('btn-worldcaps').classList.toggle('on', showWorldCapitals);
  drawCities(ERAS[cur]);
};
document.getElementById('btn-worldcaps').classList.toggle('on', showWorldCapitals);

document.getElementById('btn-cities').onclick = () => {
  showSomaliCities = !showSomaliCities;
  document.getElementById('btn-cities').classList.toggle('on', showSomaliCities);
  drawCities(ERAS[cur]);
};
document.getElementById('btn-cities').classList.toggle('on', showSomaliCities);

map.on('zoomend', () => drawCities(ERAS[cur]));

const track = document.getElementById('era-track');
ERAS.forEach((era, i) => {
  const btn = document.createElement('button');
  btn.className = 'era-btn' + (i === 0 ? ' active' : '');
  btn.title = era.title;
  const sy = era.year.length > 10 ? era.year.slice(0, 8) + '…' : era.year;
  btn.innerHTML = `<div class="era-dot"></div><span class="era-yr">${sy}<br>${era.suffix}</span>`;
  btn.onclick = () => { cur = i; renderEra(i); stopAuto(); };
  track.appendChild(btn);
});

document.getElementById('prev-btn').onclick = () => { if (cur > 0) { cur--; renderEra(cur); stopAuto(); } };
document.getElementById('next-btn').onclick = () => { if (cur < ERAS.length - 1) { cur++; renderEra(cur); stopAuto(); } };

const pBtn = document.getElementById('play-btn');
let autoT = null;
function stopAuto() {
  if (autoT) { clearInterval(autoT); autoT = null; }
  pBtn.innerHTML = '&#9654; Play';
  pBtn.classList.remove('playing');
}
pBtn.onclick = () => {
  if (autoT) { stopAuto(); return; }
  pBtn.innerHTML = '&#9646;&#9646; Pause';
  pBtn.classList.add('playing');
  autoT = setInterval(() => {
    cur = (cur + 1) % ERAS.length;
    renderEra(cur);
  }, 4500);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  && cur > 0)               { cur--; renderEra(cur); stopAuto(); }
  if (e.key === 'ArrowRight' && cur < ERAS.length - 1) { cur++; renderEra(cur); stopAuto(); }
  if (e.key === ' ')                                    { e.preventDefault(); pBtn.click(); }
});

const SOMALIWEYN_FEATURE = { type:'Feature', geometry:{ type:'Polygon', coordinates:[SOMALIWEYN_COORDS] } };

let somaliweynLayer = null;
let somaliweynOn = false;

function drawSomaliweyn() {
  if (somaliweynLayer) map.removeLayer(somaliweynLayer);
  somaliweynLayer = L.layerGroup();

  L.geoJSON(SOMALIWEYN_FEATURE, {
    pane: 'somaliweynPane',
    style: {
      fillColor: '#d8b56a',
      fillOpacity: 0.02,
      color: '#e4c56f',
      weight: 1.8,
      dashArray: '7 4',
      lineCap: 'round',
      lineJoin: 'round'
    },
    interactive: false
  }).addTo(somaliweynLayer);

  // Inner glow
  L.geoJSON(SOMALIWEYN_FEATURE, {
    pane: 'somaliweynPane',
    style: {
      fillOpacity: 0,
      color: '#f7f0dd',
      weight: 0.95,
      opacity: 0.88
    },
    interactive: false
  }).addTo(somaliweynLayer);

  // Coast accent on the Indian Ocean side
  const coastSlice = SOMALIWEYN_COORDS.filter(c => c[0] > 42 && c[1] < 3);
  if (coastSlice.length > 2) {
    L.polyline(coastSlice, {
      pane: 'somaliweynPane',
      color: '#7fcfe0',
      weight: 1.15,
      opacity: 0.82,
      interactive: false
    }).addTo(somaliweynLayer);
  }

  somaliweynLayer.addTo(map);
}

function toggleSomaliweyn() {
  somaliweynOn = !somaliweynOn;
  const btn = document.getElementById('btn-somaliweyn');
  if (somaliweynOn) {
    drawSomaliweyn();
    btn.classList.add('on');
  } else {
    if (somaliweynLayer) map.removeLayer(somaliweynLayer);
    somaliweynLayer = null;
    btn.classList.remove('on');
  }
}

document.getElementById('btn-somaliweyn').onclick = toggleSomaliweyn;



function dismissLoader() {
  const l = document.getElementById('loader');
  if (!l || l.dataset.dismissed === '1') return;
  l.dataset.dismissed = '1';
  l.classList.add('gone');
  setTimeout(() => { if (l.parentNode) l.remove(); }, 700);
}

let __xogBooted = false;
function bootXog() {
  if (__xogBooted) return;
  __xogBooted = true;
  try {
    map.invalidateSize();
    renderEra(0);
  } catch (err) {
    console.error('Xog boot error:', err);
  } finally {
    dismissLoader();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootXog, { once: true });
} else {
  bootXog();
}

window.addEventListener('load', dismissLoader, { once: true });
setTimeout(bootXog, 1200);
setTimeout(dismissLoader, 1800);
